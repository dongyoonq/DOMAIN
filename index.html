        #result-area { margin-top: 20px; padding: 20px; background: #000; border-radius: 8px; border-left: 5px solid var(--gold); min-height: 50px; }

        th, td { border: 1px solid #444; padding: 12px; text-align: center; }

    function combinations(n, r) {
        if (r < 0 || r > n) return 0;
        if (r === 0 || r === n) return 1;
        let res = 1;
        for (let i = 1; i <= r; i++) res = res * (n - i + 1) / i;
        return res;
    }

    function getProb(n, k) {
        if (k <= 0) return 100;
        if (k > n) return 0;
        let prob = 0;
        for (let i = k; i <= n; i++) prob += combinations(n, i) * Math.pow(0.25, i) * Math.pow(0.75, n - i);
        return (prob * 100).toFixed(1);
    }

    function calculateOptimization() {
        const targets = Array.from(document.querySelectorAll('#target-skill-list .item-row')).map(r => ({

            const level = parseInt(r.querySelector('.cur-lvl').value) || 0;
            const names = Array.from(r.querySelectorAll('.s-n')).map(sel => sel.value);
            const vals = Array.from(r.querySelectorAll('.s-v')).map(inp => parseInt(inp.value) || 0);
            
            const nameSet = new Set(names);
            if (nameSet.size !== 4) {
                resArea.innerHTML = `<p class="error">⚠️ [데이터 오류] ${num}번 카드의 옵션 4개는 모두 달라야 합니다.</p>`;
                return;
            }

            let currentSum = 0;
            vals.forEach(v => currentSum += v);
            const expectedSum = level + 4;

            if (currentSum !== expectedSum) {
                resArea.innerHTML = `<p class="error">⚠️ [데이터 오류] ${num}번 카드(${level}강)의 수치 합계는 ${expectedSum}이어야 합니다. (입력값: ${currentSum})</p>`;
                return;
            }

            let stats = {};
            names.forEach((n, i) => { stats[n] = (stats[n] || 0) + vals[i]; });
            userCards.push({ num, type, level, stats });
        }

        const groups = {};
        cardTypes.forEach(t => groups[t] = userCards.filter(c => c.type === t));

        let bestSet = findSet(groups, cardTypes, targets);

        if (bestSet) {
            let html = `<h3 style="color:#2ecc71;">✅ 현재 보유 카드로 목표 달성 완료!</h3>`;
            html += `<table><tr><th>부위</th><th>번호</th><th>강화</th><th>보유 옵션</th></tr>`;
            cardTypes.forEach(type => {
                const c = bestSet.find(card => card.type === type);
                if(c) {
                    let opt = Object.entries(c.stats).filter(([n,v])=>v>0).map(([n,v])=>`<span class="skill-tag">${n}+${v}</span>`).join('');
                    html += `<tr style="background:rgba(46,204,113,0.1)"><td><b>${type}</b></td><td><span class="card-num">${c.num}</span></td><td>${c.level}강</td><td>${opt}</td></tr>`;
                } else { 
                    html += `<tr><td><b>${type}</b></td><td colspan="3" style="color:#666;">- 미장착 -</td></tr>`; 
                }
            });
            html += `</table>`;
            resArea.innerHTML = html;
        } else {
            let html = `<p class="error">❌ 현재 수치로는 목표 달성이 불가능합니다.</p>
                        <h3>💡 강화 확률 분석 (목표 도달 시나리오)</h3>`;
            
            let allScenarios = [];
            targets.forEach(t => {
                let currentSum = 0;
                cardTypes.forEach(type => {
                    let max = 0;
                    if(groups[type]) {
                        groups[type].forEach(c => { if((c.stats[t.name]||0) > max) max = c.stats[t.name]; });
                    }
                    currentSum += max;
                });

                let totalNeeded = t.val - currentSum;
                if (totalNeeded <= 0) return;

                let candidates = [];
                cardTypes.forEach(type => {
                    if(groups[type]) {
                        let bestInType = groups[type]
                            .filter(c => c.level < 5 && (c.stats[t.name] || 0) > 0)
                            .sort((a, b) => (5 - a.level) - (5 - b.level))[0]; 
                        if (bestInType) candidates.push(bestInType);
                    }
                });

                let scenarios = [];
                function findCombinations(idx, remain, currentPath, currentProb) {
                    if (remain <= 0) {
                        scenarios.push({ path: [...currentPath], prob: currentProb * 100 });
                        return;
                    }
                    if (idx >= candidates.length) return;

                    let card = candidates[idx];
                    let maxUp = 5 - card.level;

                    for (let up = 0; up <= Math.min(remain, maxUp); up++) {
                        let p = up === 0 ? 1 : getProb(maxUp, up) / 100;
                        if (p > 0) {
                            if (up > 0) currentPath.push({ num: card.num, type: card.type, up: up });
                            findCombinations(idx + 1, remain - up, currentPath, currentProb * p);
                            if (up > 0) currentPath.pop();
                        }
                    }
                }

                findCombinations(0, totalNeeded, [], 1);
                scenarios.forEach(s => {
                    allScenarios.push({ skill: t.name, needed: totalNeeded, details: s.path, chance: parseFloat(s.prob.toFixed(2)) });
                });
            });

            if (allScenarios.length > 0) {
                html += `<table><tr><th>추천 강화 조합</th><th>대상 스킬</th><th>필요치</th><th>성공 확률</th></tr>`;
                allScenarios.sort((a, b) => b.chance - a.chance).slice(0, 10).forEach(s => {
                    let desc = s.details.map(d => `<span class="card-num">${d.num}</span>(${d.type}) <b style="color:#ffd700;">+${d.up}</b>`).join(' & ');
                    html += `<tr><td style="text-align:left;">${desc}</td><td>${s.skill}</td><td>+${s.needed}</td>
                             <td><b style="color:#3498db;">${s.chance}%</b><div class="prob-bar-bg"><div class="prob-bar-fill" style="width:${s.chance}%"></div></div></td></tr>`;
                });
                html += `</table>`;
            } else {
                html += `<p style="color:#888;">보유한 카드를 최대 강화(5강)해도 목표치에 도달할 수 없습니다. 카드를 더 추가해 주세요.</p>`;
            }
            resArea.innerHTML = html;
        }
    }

    function findSet(groups, types, targets) {
        let res = null;
        function backtrack(idx, stats, path) {
            if (idx === types.length) {
                if (targets.every(t => (stats[t.name] || 0) >= t.val)) { 
                    res = [...path]; 
                    return true; 
                }
                return false;
            }
            const currentType = types[idx];
            const currentGroup = groups[currentType] || [];
            if (backtrack(idx + 1, stats, path)) return true;
            for (let c of currentGroup) {
                let ns = {...stats};
                for(let s in c.stats) ns[s] = (ns[s] || 0) + c.stats[s];
                if (backtrack(idx + 1, ns, [...path, c])) return true;
            }
            return false;
        }
        backtrack(0, {}, []);
        return res;
    }
</script>
